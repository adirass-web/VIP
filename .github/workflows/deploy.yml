name: Deploy Toza to Cloudflare Pages

on:
  push:
    branches:
      - main

concurrency:
  group: toza-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    env:
      CLOUDFLARE_ACCOUNT_ID: cfd055f2f8175d13377bd64e9620ea36
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PROJECT_NAME: toza-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify route, copy, RTL, links, and CI contracts
        run: npm run verify:all

      - name: Install Chromium for RTL visual checks
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium chromium-headless-shell

      - name: Run RTL visual checks
        run: npm run test:rtl-visual

      - name: Ensure new Toza Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}"
          if ! curl -fsS "$API" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" >/dev/null; then
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${CF_PROJECT_NAME}\",\"production_branch\":\"main\"}" >/dev/null
          fi

      - name: Deploy to new Toza Pages project
        run: npx --yes wrangler@4 pages deploy _site --project-name "$CF_PROJECT_NAME" --branch main --commit-hash "$GITHUB_SHA"
