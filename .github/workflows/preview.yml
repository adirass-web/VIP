name: Preview Toza direction A

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: toza-design-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/toza-clear-practice'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run verify:all
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium chromium-headless-shell
      - run: npm run test:rtl-visual
        env:
          CI: true
      - name: Exclude preview from indexing
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> _site/_headers
      - name: Deploy reviewed branch preview
        env:
          CLOUDFLARE_ACCOUNT_ID: cfd055f2f8175d13377bd64e9620ea36
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --yes wrangler@4 pages deploy _site --project-name toza-site --branch design-a --commit-hash "$PREVIEW_SHA"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-a-preview-checks
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
