name: Verify PR59 production publication
on:
  push:
    branches: [codex/toza-pr59-production-check]
permissions:
  contents: read
jobs:
  verify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify:all
      - name: Verify published release without deployment credentials
        env:
          PREVIEW_HEAD_SHA: ${{ github.sha }}
        run: node scripts/verify-pr59-production.mjs
      - name: Preserve production verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr59-production-checks
          path: |
            .wrangler/pr59-production-checks.json
            .wrangler/hosted-mismatch.json
          include-hidden-files: true
          if-no-files-found: ignore
